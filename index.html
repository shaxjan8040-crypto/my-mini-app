<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mening Mini Appim</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: var(--tg-theme-bg-color, #ffffff);
            color: var(--tg-theme-text-color, #000000);
            margin: 0;
            padding: 20px;
            text-align: center;
        }
        .card {
            background-color: var(--tg-theme-secondary-bg-color, #f4f4f5);
            border-radius: 14px;
            padding: 20px;
            margin-top: 20px;
        }
        button {
            background-color: var(--tg-theme-button-color, #3390ec);
            color: var(--tg-theme-button-text-color, #ffffff);
            border: none;
            padding: 12px 24px;
            border-radius: 10px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 15px;
        }
    </style>
</head>
<body>
    <h2 id="greeting">Salom!</h2>
    <div class="card">
        <p>Mini App muvaffaqiyatli ishga tushdi!</p>
        <button onclick="tg.showAlert('Hammasi ajoyib ishlayapti!')">Tekshirish</button>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand();

        // Foydalanuvchi ismini chiqarish
        const user = tg.initDataUnsafe?.user;
        if (user && user.first_name) {
            document.getElementById('greeting').innerText = `Salom, ${user.first_name}!`;
        }
    </script>
</body>
</html>
